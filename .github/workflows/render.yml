name: Render Hydraulic Press Short

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "stills = 4 stills | test = first 90 frames | preview = full half-res | full = final"
        type: choice
        default: test
        options: [stills, test, preview, full]
      gl:
        description: "WebGL backend"
        type: choice
        default: angle
        options: [angle, swangle, swiftshader]
      concurrency:
        description: "Parallel browser tabs"
        type: choice
        default: "2"
        options: ["1", "2", "3", "4"]

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 libpangocairo-1.0-0 libpango-1.0-0 libcairo2 libatspi2.0-0 libgtk-3-0 libgl1-mesa-dri libegl1

      - name: Extract uploaded project ZIP
        run: |
          unzip -q hydraulic_press_remotion_project.zip -d _src
          PROJECT_DIR="$(dirname "$(find _src -maxdepth 4 -name package.json | head -1)")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using project: $PROJECT_DIR"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install --no-audit --no-fund

      - name: Ensure Remotion browser
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx remotion browser ensure

      - name: Type check
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx tsc --noEmit

      - name: Render selected mode
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          MODE: ${{ inputs.mode || 'test' }}
          GL: ${{ inputs.gl || 'angle' }}
          CONCURRENCY: ${{ inputs.concurrency || '2' }}
        run: |
          mkdir -p out
          case "$MODE" in
            stills) npm run stills ;;
            test) npx remotion render src/index.ts HydraulicPress out/hydraulic_press_test.mp4 --frames=0-89 --gl="$GL" --concurrency="$CONCURRENCY" --crf=19 ;;
            preview) npx remotion render src/index.ts HydraulicPress out/hydraulic_press_preview.mp4 --scale=0.5 --gl="$GL" --concurrency="$CONCURRENCY" --crf=19 ;;
            full) npx remotion render src/index.ts HydraulicPress out/hydraulic_press_final.mp4 --codec=h264 --gl="$GL" --concurrency="$CONCURRENCY" --crf=19 ;;
          esac

      - name: Upload render
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hydraulic-press-${{ inputs.mode || 'test' }}
          path: ${{ env.PROJECT_DIR }}/out/*
          if-no-files-found: warn
          retention-days: 14
          
