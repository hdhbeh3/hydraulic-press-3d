
name: Render Hydraulic Press Short

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Choose render mode"
        type: choice
        required: true
        default: test
        options:
          - stills
          - test
          - preview
          - full

      gl:
        description: "WebGL backend"
        type: choice
        required: true
        default: angle
        options:
          - angle
          - swangle
          - swiftshader

      concurrency:
        description: "Parallel render tabs"
        type: choice
        required: true
        default: "2"
        options:
          - "1"
          - "2"
          - "3"
          - "4"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            libnss3 \
            libdbus-1-3 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libgbm1 \
            libasound2t64 \
            libpangocairo-1.0-0 \
            libpango-1.0-0 \
            libcairo2 \
            libatspi2.0-0 \
            libgtk-3-0 \
            libgl1-mesa-dri \
            libegl1

      - name: Extract uploaded project ZIP
        run: |
          ZIP_FILE="hydraulic_press_optimized_v2.zip"

          echo "Repository files:"
          ls -lah

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found: $ZIP_FILE"
            exit 1
          fi

          mkdir -p _src
          unzip -q "$ZIP_FILE" -d _src

          PACKAGE_FILE=$(find _src -maxdepth 4 -name package.json | head -1)

          if [ -z "$PACKAGE_FILE" ]; then
            echo "ERROR: package.json not found inside ZIP"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project found at: $PROJECT_DIR"
          ls -lah "$PROJECT_DIR"

      - name: Install Node dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install --no-audit --no-fund

      - name: Ensure Remotion browser
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx remotion browser ensure

      - name: TypeScript check
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx tsc --noEmit

      - name: Render selected mode
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          MODE: ${{ inputs.mode }}
          GL: ${{ inputs.gl }}
          CONCURRENCY: ${{ inputs.concurrency }}
        run: |
          mkdir -p out

          echo "Render mode: $MODE"
          echo "WebGL: $GL"
          echo "Concurrency: $CONCURRENCY"

          case "$MODE" in

            stills)
              npm run stills
              ;;

            test)
              npx remotion render \
                src/index.ts HydraulicPress \
                out/hydraulic_press_test.mp4 \
                --frames=0-89 \
                --gl="$GL" \
                --concurrency="$CONCURRENCY" \
                --crf=19
              ;;

            preview)
              npx remotion render \
                src/index.ts HydraulicPress \
                out/hydraulic_press_preview.mp4 \
                --scale=0.5 \
                --gl="$GL" \
                --concurrency="$CONCURRENCY" \
                --crf=19
              ;;

            full)
              npx remotion render \
                src/index.ts HydraulicPress \
                out/hydraulic_press_final.mp4 \
                --codec=h264 \
                --gl="$GL" \
                --concurrency="$CONCURRENCY" \
                --crf=19
              ;;

            *)
              echo "Invalid render mode: $MODE"
              exit 1
              ;;
          esac

      - name: Upload rendered files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hydraulic-press-${{ inputs.mode }}
          path: ${{ env.PROJECT_DIR }}/out/*
          if-no-files-found: warn
          retention-days: 14
          
