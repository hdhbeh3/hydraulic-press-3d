name: Render Hydraulic Press Short

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Choose render mode"
        type: choice
        required: true
        default: test
        options:
          - test
          - preview
          - full
          - still

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            unzip \
            libnss3 \
            libdbus-1-3 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libgbm1 \
            libasound2t64 \
            libpangocairo-1.0-0 \
            libpango-1.0-0 \
            libcairo2 \
            libatspi2.0-0 \
            libgtk-3-0 \
            libgl1-mesa-dri \
            libegl1

      - name: Extract latest project ZIP
        shell: bash
        run: |
          ZIP_FILE="hydraulic_press_remotion_project_1 (1).zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP not found: $ZIP_FILE"
            ls -lah
            exit 1
          fi

          mkdir -p _src
          unzip -q -o "$ZIP_FILE" -d _src

          PACKAGE_FILE=$(find _src -maxdepth 6 \
            -name package.json -print -quit)

          if [ -z "$PACKAGE_FILE" ]; then
            echo "ERROR: package.json not found inside ZIP"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PACKAGE_FILE")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Using corrected project: $PROJECT_DIR"
          ls -lah "$PROJECT_DIR"

      - name: Install Node dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Ensure Remotion browser
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx remotion browser ensure

      - name: Project checks
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npm run check
          npm test
          npm run typecheck

      - name: Render selected mode
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          MODE: ${{ inputs.mode }}
        run: |
          mkdir -p out

          echo "Render mode: $MODE"

          case "$MODE" in

            test)
              npx remotion render \
                src/index.ts HydraulicPress \
                out/hydraulic_press_test.mp4 \
                --frames=0-89 \
                --codec=h264 \
                --crf=20 \
                --gl=swangle \
                --concurrency=2 \
                --overwrite
              ;;

            preview)
              npm run render:preview
              ;;

            full)
              npm run render
              ;;

            still)
              npm run still
              ;;

            *)
              echo "Invalid render mode: $MODE"
              exit 1
              ;;
          esac

      - name: Upload rendered files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hydraulic-press-${{ inputs.mode }}
          path: ${{ env.PROJECT_DIR }}/out/*
          if-no-files-found: warn
          retention-days: 14
          
